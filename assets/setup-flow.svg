<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="850" viewBox="0 0 1280 850" role="img" aria-labelledby="title desc">
<title id="title">Use Step Code in T3 through ACP</title>
<desc id="desc">Install and authenticate Step Code, install the adapter, add a local ACP provider in T3, and start a task. Registry icons use the client’s supported Registry interface.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#6f8caa" stroke-width="1.5"/></marker></defs>
<rect width="1280" height="850" rx="24" fill="#101b2d"/>
<g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif">
<text x="48" y="49" font-size="13" fill="#83c7ff" font-weight="650">STEP CODE ACP</text>
<text x="48" y="107" font-size="38" fill="#f3f7ff" font-weight="700">Start in T3. Work with Step Code.</text>
<text x="48" y="145" font-size="17" fill="#aab9ce" font-weight="400">Install and sign in once. Then choose a project, select your model, and work in T3.</text>
<text x="48" y="201" font-size="12" fill="#8ba1bc" font-weight="600">ONE-TIME SETUP · ON THE MACHINE RUNNING YOUR T3 SERVER</text>
<rect x="48" y="222" width="281" height="175" rx="16" fill="#14243a" stroke="#2b3c53"/>
<text x="66" y="260" font-size="15" fill="#b4e1ff" font-weight="650">01</text>
<text x="66" y="305" font-size="19" fill="#f3f7ff" font-weight="600">Install Step Code CLI</text>
<text x="66" y="341" font-size="15" fill="#aab9ce" font-weight="400">Sign in with your Plan / API</text>
<text x="66" y="367" font-size="15" fill="#aab9ce" font-weight="400">Confirm that step can chat</text>
<path d="M332 308h12" stroke="#6f8caa" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="349" y="222" width="281" height="175" rx="16" fill="#14243a" stroke="#2b3c53"/>
<text x="367" y="260" font-size="15" fill="#b4e1ff" font-weight="650">02</text>
<text x="367" y="305" font-size="19" fill="#f3f7ff" font-weight="600">Install this ACP adapter</text>
<text x="367" y="341" font-size="15" fill="#aab9ce" font-weight="400">Download a release or clone</text>
<text x="367" y="367" font-size="15" fill="#aab9ce" font-weight="400">Keep the installation directory</text>
<path d="M633 308h12" stroke="#6f8caa" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="650" y="222" width="281" height="175" rx="16" fill="#14243a" stroke="#2b3c53"/>
<text x="668" y="260" font-size="15" fill="#b4e1ff" font-weight="650">03</text>
<text x="668" y="305" font-size="19" fill="#f3f7ff" font-weight="600">Add a provider in T3</text>
<text x="668" y="341" font-size="15" fill="#aab9ce" font-weight="400">Choose Local ACP command</text>
<text x="668" y="367" font-size="15" fill="#aab9ce" font-weight="400">Paste the full executable path</text>
<path d="M934 308h12" stroke="#6f8caa" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="951" y="222" width="281" height="175" rx="16" fill="#14243a" stroke="#2b3c53"/>
<text x="969" y="260" font-size="15" fill="#b4e1ff" font-weight="650">04</text>
<text x="969" y="305" font-size="19" fill="#f3f7ff" font-weight="600">Start working in T3</text>
<text x="969" y="341" font-size="15" fill="#aab9ce" font-weight="400">Open project · select Step Code</text>
<text x="969" y="367" font-size="15" fill="#aab9ce" font-weight="400">Choose a model · send a task</text>
<text x="48" y="449" font-size="12" fill="#8ba1bc" font-weight="600">EVERYDAY USE · WHAT RUNS WHEN YOU SEND A TASK</text>
<rect x="48" y="470" width="281" height="103" rx="14" fill="#102d36" stroke="#275461"/>
<text x="68" y="513" font-size="23" fill="#c1f1e8" font-weight="600">T3 Code</text>
<text x="68" y="544" font-size="15" fill="#9dc6c8" font-weight="400">Projects &amp; conversation</text>
<path d="M332 520h12" stroke="#6f8caa" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="349" y="470" width="281" height="103" rx="14" fill="#102d36" stroke="#275461"/>
<text x="369" y="513" font-size="23" fill="#c1f1e8" font-weight="600">ACP adapter</text>
<text x="369" y="544" font-size="15" fill="#9dc6c8" font-weight="400">The connector in this repo</text>
<path d="M633 520h12" stroke="#6f8caa" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="650" y="470" width="281" height="103" rx="14" fill="#102d36" stroke="#275461"/>
<text x="670" y="513" font-size="23" fill="#c1f1e8" font-weight="600">Step Code CLI</text>
<text x="670" y="544" font-size="15" fill="#9dc6c8" font-weight="400">The actual coding agent</text>
<path d="M934 520h12" stroke="#6f8caa" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="951" y="470" width="281" height="103" rx="14" fill="#102d36" stroke="#275461"/>
<text x="971" y="513" font-size="23" fill="#c1f1e8" font-weight="600">Step service</text>
<text x="971" y="544" font-size="15" fill="#9dc6c8" font-weight="400">Your own Plan / API</text>
<text x="48" y="608" font-size="16" fill="#aab9ce" font-weight="400">Your account and API key stay with Step Code. T3 starts the adapter and Step Code as needed.</text>
<rect x="48" y="651" width="1184" height="123" rx="16" fill="#17283e" stroke="#354e6c"/>
<text x="70" y="683" font-size="14" fill="#a9ccf4" font-weight="650">REGISTRY BRANDING</text>
<text x="70" y="717" font-size="20" fill="#e2edff" font-weight="600">Icons belong to the client’s supported Registry integration.</text>
<text x="70" y="749" font-size="16" fill="#aab9ce" font-weight="400">Registry review is required. A manually added local command may show a generic ACP icon.</text>
<text x="48" y="815" font-size="13" fill="#7f94ad" font-weight="400">Community adapter · No T3 frontend patches · See README for compatibility and Registry status</text>
</g></svg>
